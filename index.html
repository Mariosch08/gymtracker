<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0f1115;--card:#171a21;--card2:#20242d;--line:#2a2f3a;--txt:#e9ecf1;--mut:#8b93a3;--acc:#4ade80;--acc2:#22c55e;--warn:#fbbf24;--red:#f87171;--blue:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font:inherit}
a{color:var(--blue)}
header{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 12px 0}
.htop{display:flex;justify-content:space-between;align-items:center;max-width:640px;margin:0 auto}
h1{font-size:19px;margin:0}
.gear{background:none;border:0;color:var(--mut);font-size:22px;padding:4px 6px;cursor:pointer}
.gear.on{color:var(--acc)}
nav{display:flex;max-width:640px;margin:4px auto 0}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 0 10px;font-size:14px;border-bottom:2px solid transparent;cursor:pointer}
nav button.on{color:var(--txt);border-color:var(--acc)}
main{padding:12px;max-width:640px;margin:0 auto;padding-bottom:150px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.muted{color:var(--mut);font-size:14px}
.sec{color:var(--mut);margin:20px 2px 8px;font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.06em}
.big{font-size:26px;font-weight:750;margin:2px 0 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:11px;padding:12px 16px;font-size:16px;font-weight:600;cursor:pointer;background:var(--card2);color:var(--txt)}
.btn.pri{background:var(--acc2);color:#04160a;width:100%}
.btn.sm{padding:8px 12px;font-size:14px}
.btn.xs{padding:5px 9px;font-size:13px;border-radius:8px}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.danger{background:none;color:var(--red);border:1px solid #4a2626}
.btn.on{border-color:var(--acc);color:var(--acc)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.exhead{display:flex;gap:12px;align-items:center}
.exname{font-weight:700;font-size:17px;line-height:1.25}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{background:var(--card2);color:var(--mut);border:0;border-radius:8px;padding:3px 8px;font-size:13px}
button.chip{cursor:pointer}
.chip.hl{color:var(--txt)}
.badge{display:inline-block;background:#3a2f0b;color:var(--warn);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;margin-top:8px}
.badge.pr{background:#11321f;color:var(--acc)}
.thumb{width:62px;height:46px;border-radius:10px;overflow:hidden;flex:none;background:#fff;position:relative;border:0;padding:0;cursor:pointer}
.thumb.noimg{background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--mut)}
.anim{position:relative;overflow:hidden;background:#fff}
.anim img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.anim img.b{animation:flip 1.8s steps(1) infinite}
@keyframes flip{0%{opacity:0}50%{opacity:1}}
.hero{width:100%;aspect-ratio:3/2;border-radius:12px}
table{width:100%;border-collapse:collapse;margin-top:8px}
td,th{padding:4px 2px;text-align:center}
th{font-size:12px;color:var(--mut);font-weight:500}
td.n{color:var(--mut);width:24px;font-size:14px}
input[type=number],input[type=text],select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:10px 8px;font-size:16px}
input[type=number]{text-align:center;padding:10px 3px;-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input::placeholder,textarea::placeholder{color:#5c6474}
input:focus,textarea:focus,select:focus{outline:none;border-color:#3d6b52}
textarea{min-height:64px;resize:vertical;font-family:inherit;font-size:15px}
.kgwrap{display:flex;gap:3px;align-items:center}
.pm{width:28px;height:42px;flex:none;border-radius:8px;border:1px solid var(--line);background:none;color:var(--mut);font-size:18px;cursor:pointer;padding:0}
.chk{width:44px;height:42px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--mut);font-size:20px;cursor:pointer}
tr.done .chk,.chk.done{background:var(--acc2);color:#04160a;border-color:var(--acc2)}
tr.done input{border-color:#245c38;color:#b7f5cc}
.card.alldone{border-color:#245c38}
.tools{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.notebox{margin-top:10px;background:#1b2130;border:1px solid #2a3348;border-radius:10px;padding:8px 10px;font-size:14px;color:#c9d1dd;white-space:pre-wrap;cursor:pointer}
.notebox.empty{background:none;border:1px dashed var(--line);color:var(--mut)}
.restbox{display:flex;gap:6px;align-items:center;margin-top:8px;background:var(--card2);border-radius:10px;padding:6px}
.restbox b{flex:1;text-align:center;font-size:18px}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.cgrid label,.pe-grid label{font-size:11px;color:var(--mut);display:block;margin-bottom:3px}
.pe-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.pe-grid input{padding:8px 2px;font-size:15px}
.pe-ex{border-top:1px solid var(--line);padding:12px 0}
.pe-ex:first-of-type{border-top:0}
#timer{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#122a1b;border-top:1px solid #245c38;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px}
#timer[hidden]{display:none}
#tTime{font-size:30px;font-weight:750;font-variant-numeric:tabular-nums}
#tBar{position:absolute;left:0;top:0;height:3px;background:var(--acc)}
#timer.over{background:#3a2f0b;border-color:#6b5414}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:#1b2333;border-top:1px solid #34405a;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
.savebar .btn{flex:1}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:#22332a;color:#dfe;padding:10px 16px;border-radius:10px;z-index:30;font-size:14px;max-width:90%;text-align:center}
#toast[hidden]{display:none}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:90vh;display:flex;flex-direction:column}
.panel-h{padding:14px;border-bottom:1px solid var(--line)}
.panel-b{padding:8px 14px calc(24px + env(safe-area-inset-bottom));overflow-y:auto}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin-top:10px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:8px;border-radius:8px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--card);color:var(--txt);font-weight:600}
.pick{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--txt);padding:8px 2px;font-size:16px;cursor:pointer}
.pick img,.pick .ph{width:48px;height:34px;border-radius:7px;object-fit:cover;background:#fff;flex:none}
.pick .ph{background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:18px}
.pick small{color:var(--mut)}
.stat{flex:1;background:var(--card2);border-radius:12px;padding:10px;text-align:center;min-width:0}
.stat b{display:block;font-size:22px}
.up{color:var(--acc)} .down{color:var(--red)}
svg.spark{display:block;width:100%;height:46px;margin-top:8px}
.hist .ex{font-size:14px;margin-top:3px}
.prog td,.prog th{text-align:left;font-size:14px}
ol.cues{margin:8px 0 0;padding-left:20px}
ol.cues li{margin:4px 0}
label.chkrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
label.chkrow:first-child{border-top:0}
label.chkrow input{width:22px;height:22px;flex:none;accent-color:var(--acc2)}
label.chkrow span{flex:1}
.setrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow span{flex:1}
.setrow input,.setrow select{width:96px}
</style>
</head>
<body>
<header>
  <div class="htop"><h1>Gym Tracker</h1><button class="gear" data-act="nav" data-v="settings" aria-label="Einstellungen">⚙︎</button></div>
  <nav>
    <button data-act="nav" data-v="home">Training</button>
    <button data-act="nav" data-v="history">Verlauf</button>
    <button data-act="nav" data-v="progress">Fortschritt</button>
    <button data-act="nav" data-v="plan">Plan</button>
  </nav>
</header>
<main id="app"><div class="muted">Lädt …</div></main>
<div id="modal"></div>
<div id="savebar"></div>
<div id="timer" hidden>
  <div id="tBar"></div>
  <div class="grow"><div class="muted" id="tLabel">Pause</div><div id="tTime">0:00</div></div>
  <button class="btn sm ghost" data-act="tminus">−15</button>
  <button class="btn sm ghost" data-act="tplus">+15</button>
  <button class="btn sm" data-act="tstop">Stopp</button>
</div>
<div id="toast" hidden></div>
<script src="exercises.js"></script>
<script>
/* ================= Bibliothek ================= */
const MUSCLES = CATALOG.map(c=>c[0]);
const CAT = {};
CATALOG.forEach(([m,l])=>l.forEach(([id,name,cues,uni])=>CAT[id]={id,name,muscle:m,cues:cues?cues.split('|'):[],uni:!!uni,img:true}));
const CARD = {};
CARDIO.forEach(([id,name,icon,fields])=>CARD[id]={id,name,icon,fields,muscle:'Cardio',cardio:true});
const isCardio = id => !!CARD[id] || String(id).startsWith('cardio_');

/* ================= State ================= */
const DEF_SETTINGS={step:2.5,defRest:90,defSets:3,defRepMin:8,defRepMax:12,autoTimer:true,autoInc:true,sound:true,vibrate:true,wake:true};
const S = { db:null, plan:null, planLoaded:false, sessions:[], sessLoaded:false,
  lib:{custom:[],notes:{}}, settings:{...DEF_SETTINGS}, body:{entries:[]},
  view:'home', draft:null, timer:null, confirm:null, modal:null, restEdit:null, noteEdit:null,
  planEdit:null, peDirty:false, editSess:null, summary:null, openProg:{}, exportText:null, importData:null };
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
S.draft=lsGet('gt_draft2'); S.timer=lsGet('gt_timer');
if(S.draft&&!Array.isArray(S.draft.items)) S.draft=null;
if(S.draft) S.draft.items.forEach(it=>{ if(!it.kind) it.kind='s' });

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:null};
const r2=x=>Math.round(x*100)/100;
const fmtD=iso=>{try{return new Date(iso).toLocaleDateString('de-CH',{weekday:'short',day:'2-digit',month:'2-digit'})}catch(e){return''}};
const fmtT=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const effReps=st=>st.repsR!=null&&st.repsR!==''?Math.min(+st.reps||0,+st.repsR||0):(+st.reps||0);
const e1rm=st=>{const kg=+st.kg||0,r=effReps(st);return kg>0?kg*(1+r/30):r};
const setVol=st=>(+st.kg||0)*((+st.reps||0)+(st.repsR!=null&&st.repsR!==''?(+st.repsR||0):0));
const fmtSet=st=>esc(st.kg)+'×'+esc(st.reps)+(st.repsR!=null&&st.repsR!==''?'/'+esc(st.repsR):'');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const weekStart=(d=new Date())=>{const w=new Date(d);w.setHours(0,0,0,0);w.setDate(w.getDate()-((w.getDay()+6)%7));return w};
const ytLink=name=>'https://www.youtube.com/results?search_query='+encodeURIComponent(name+' richtige Ausführung');
function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2600)}
const ST=()=>S.settings;

function exInfo(id){ return CAT[id] || CARD[id] || (S.lib.custom||[]).find(c=>c.id===id) || {id,name:id,muscle:'',cues:[]} }
function imgHTML(id,cls){ const i=exInfo(id);
  if(i.img) return `<div class="anim ${cls||''}"><img src="img/${esc(id)}_0.jpg" alt="" loading="lazy"><img class="b" src="img/${esc(id)}_1.jpg" alt="" loading="lazy"></div>`;
  return '' }
function thumbHTML(id){ const i=exInfo(id);
  if(i.img) return `<button class="thumb anim" data-act="info" data-ex="${esc(id)}"><img src="img/${esc(id)}_0.jpg" alt="" loading="lazy"><img class="b" src="img/${esc(id)}_1.jpg" alt="" loading="lazy"></button>`;
  return `<button class="thumb noimg" data-act="info" data-ex="${esc(id)}">${i.cardio?i.icon:'ℹ︎'}</button>` }
function days(p=S.plan){ if(!p||!p.days) return []; return (p.order||Object.keys(p.days)).filter(k=>p.days[k]).map(k=>({id:k,...p.days[k]})) }
function nextDayId(){ const order=days().map(d=>d.id); if(!order.length) return null;
  const last=S.sessions.find(s=>order.includes(s.dayId)); if(!last) return order[0];
  return order[(order.indexOf(last.dayId)+1)%order.length] }
function lastFor(exId){ for(const s of S.sessions){const e=(s.entries||[]).find(x=>x.exId===exId&&x.sets&&x.sets.length); if(e) return {date:s.date,sets:e.sets}} return null }
function lastCardio(exId){ for(const s of S.sessions){const e=(s.entries||[]).find(x=>x.exId===exId&&x.cardio); if(e) return {date:s.date,c:e.cardio}} return null }
function bestFor(exId){ let b=null; S.sessions.forEach(s=>(s.entries||[]).forEach(e=>{ if(e.exId!==exId||!e.sets) return; e.sets.forEach(st=>{ const v=e1rm(st); if(!b||v>b.v) b={v,st} }) })); return b }
function shouldIncrease(it,last){ if(!last||ST().autoInc===false) return false; const n=it.sets||3; return last.sets.length>=n && last.sets.slice(0,n).every(st=>effReps(st)>=(it.repMax||99)) }
function fmtCardio(c,fields){ fields=fields||Object.keys(c); return fields.filter(f=>c[f]!=null&&c[f]!=='').map(f=>esc(c[f])+' '+esc((CARDIO_FIELDS[f]||[f])[0])).join(' · ') }

/* ================= Speicher (lokal) ================= */
const LocalDB=(()=>{ const KEY='gt_db'; let st={}; try{st=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
  const subs=new Set(), meta={fromCache:false,hasPendingWrites:false};
  const persist=()=>{ try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){ throw {code:'quota_exceeded'} } };
  const notify=()=>setTimeout(()=>subs.forEach(f=>f()),0);
  const snap=p=>({id:p.split('/').pop(),exists:p in st,data:()=>st[p],metadata:meta});
  function doc(p){ return {path:p, get:async()=>snap(p),
    set:async d=>{ const old=st[p]; st[p]=clone(d); try{persist()}catch(e){ if(old===undefined) delete st[p]; else st[p]=old; throw e } notify() },
    delete:async()=>{ delete st[p]; persist(); notify() },
    onSnapshot(n){ const f=()=>n(snap(p)); subs.add(f); f(); return ()=>subs.delete(f) } } }
  function collection(c){ let ord=null, lim=1e9; const depth=c.split('/').length+1;
    const q={ orderBy(f,d){ord=[f,d||'asc'];return q}, limit(n){lim=n;return q},
      onSnapshot(n){ const f=()=>{ let docs=Object.keys(st).filter(k=>k.startsWith(c+'/')&&k.split('/').length===depth).map(snap);
          if(ord) docs.sort((a,b)=>{const x=a.data()[ord[0]],y=b.data()[ord[0]];return (x<y?-1:x>y?1:0)*(ord[1]==='desc'?-1:1)});
          docs=docs.slice(0,lim); n({docs,size:docs.length,empty:!docs.length,metadata:meta}) };
        subs.add(f); f(); return ()=>subs.delete(f) },
      doc:id=>doc(c+'/'+id) };
    return q }
  return { doc, collection, all:()=>clone(st), replace:o=>{ const old=st; st=clone(o); try{persist()}catch(e){st=old;throw e} notify() } };
})();
function write(path,data){ return S.db.doc(path).set(data).catch(e=>{ toast(e&&e.code==='quota_exceeded'?'Speicher voll – alte Einträge löschen':'Speichern fehlgeschlagen'); throw e }) }
const savePlan=p=>write('plan/main',p), saveLib=()=>write('library/main',S.lib), saveSettings=()=>write('settings/main',S.settings), saveBody=()=>write('body/main',S.body);

const DEFAULT_PLAN={"order":["push","pull","legs"],"days":{
 "push":{"name":"Push","exercises":[{"id":"incline_db","name":"Schrägbank-Kurzhanteldrücken","sets":3,"repMin":6,"repMax":10,"rest":120},{"id":"flys","name":"Flys","sets":3,"repMin":10,"repMax":15,"rest":90},{"id":"lat_raise_cable","name":"Seitheben Kabelzug","sets":3,"repMin":12,"repMax":15,"rest":60},{"id":"tri_pushdown","name":"Trizeps-Pushdown","sets":3,"repMin":10,"repMax":12,"rest":60}]},
 "pull":{"name":"Pull","exercises":[{"id":"lat_pulldown","name":"Latziehen","sets":3,"repMin":6,"repMax":10,"rest":120},{"id":"row_close","name":"Enges Rudern Kabelzug","sets":3,"repMin":8,"repMax":12,"rest":120},{"id":"reverse_pec","name":"Reverse Pec Deck","sets":3,"repMin":12,"repMax":15,"rest":60},{"id":"preacher","name":"Preacher Curls","sets":3,"repMin":10,"repMax":12,"rest":60},{"id":"hammer","name":"Hammer Curls","sets":3,"repMin":10,"repMax":12,"rest":60}]},
 "legs":{"name":"Legs","exercises":[{"id":"leg_press","name":"Beinpresse","sets":3,"repMin":8,"repMax":12,"rest":120},{"id":"rdl","name":"Rumänisches Kreuzheben (KH)","sets":3,"repMin":8,"repMax":10,"rest":120},{"id":"leg_curl","name":"Leg Curl","sets":3,"repMin":10,"repMax":12,"rest":60},{"id":"leg_ext","name":"Leg Extension","sets":3,"repMin":10,"repMax":15,"rest":60}]}}};

(async function init(){
  const db=LocalDB; S.db=db;
  if(!('plan/main' in db.all())) await db.doc('plan/main').set(DEFAULT_PLAN);
  try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist() }catch(e){}
  db.doc('plan/main').onSnapshot(s=>{ S.plan=s.exists?s.data():null; if(!S.peDirty) S.planEdit=null; S.planLoaded=true; render() });
  db.collection('sessions').orderBy('date','desc').limit(5000).onSnapshot(s=>{ S.sessions=s.docs.map(d=>({id:d.id,...d.data()})); S.sessLoaded=true; render() });
  db.doc('library/main').onSnapshot(s=>{ if(s.exists){const d=clone(s.data()); S.lib={custom:d.custom||[],notes:d.notes||{}}} render() });
  db.doc('settings/main').onSnapshot(s=>{ if(s.exists) S.settings={...DEF_SETTINGS,...s.data()}; render() });
  db.doc('body/main').onSnapshot(s=>{ if(s.exists){const d=clone(s.data()); S.body={entries:d.entries||[]}} render() });
})();

/* ================= Training ================= */
function makeItem(src){ const id=src.id||src.exId, info=exInfo(id);
  if(isCardio(id)) return {kind:'c',exId:id,name:src.name||info.name,target:src.target||'',vals:{},done:false};
  const it={kind:'s',exId:id,name:src.name||info.name,muscle:src.muscle||info.muscle,
    sets:src.sets||ST().defSets,repMin:src.repMin||ST().defRepMin,repMax:src.repMax||ST().defRepMax,rest:src.rest??ST().defRest,uni:src.uni!=null?!!src.uni:!!info.uni};
  it.rows=makeRows(it); return it }
function makeRows(it){ const last=lastFor(it.exId), inc=shouldIncrease(it,last), step=+ST().step||2.5, rows=[];
  it.suggested=inc;
  for(let i=0;i<(it.sets||3);i++){ const ls=last&&(last.sets[i]||last.sets[last.sets.length-1]);
    rows.push({kg:ls?String(r2((+ls.kg||0)+(inc&&+ls.kg>0?step:0))):'',reps:'',repsR:'',done:false}) }
  return rows }
function startWorkout(dayId){ const d=S.plan.days[dayId]; if(!d) return;
  S.draft={dayId,dayName:d.name,startedAt:Date.now(),note:'',items:(d.exercises||[]).map(makeItem)};
  saveDraft(); S.view='workout'; render(); scrollTo(0,0) }
function startEmpty(name,id){ S.draft={dayId:id||'free',dayName:name||'Freies Training',startedAt:Date.now(),note:'',items:[]}; saveDraft(); S.view='workout'; render() }
function saveDraft(){ lsSet('gt_draft2',S.draft) }
function planDayEx(){ return S.plan&&S.draft&&S.plan.days[S.draft.dayId]?S.plan.days[S.draft.dayId].exercises||[]:null }

async function finish(){
  const entries=[];
  S.draft.items.forEach(it=>{
    if(it.kind==='c'){ const c={}; (CARD[it.exId]?CARD[it.exId].fields:Object.keys(it.vals)).forEach(f=>{ const v=num(it.vals[f]); if(v!=null) c[f]=v });
      if(c.min>0||it.done) entries.push({kind:'c',exId:it.exId,name:it.name,cardio:c}); return }
    const sets=it.rows.filter(r=>r.done||(num(r.reps)||0)>0).map(r=>{ const s={kg:num(r.kg)||0,reps:num(r.reps)||0}; if(it.uni) s.repsR=num(r.repsR)??s.reps; return s });
    if(sets.length) entries.push({exId:it.exId,name:it.name,muscle:it.muscle||'',uni:!!it.uni,sets}) });
  if(!entries.length){toast('Noch nichts eingetragen');return}
  const prs=[]; entries.forEach(e=>{ if(!e.sets) return; const prev=bestFor(e.exId); if(!prev) return;
    const top=e.sets.reduce((a,b)=>e1rm(b)>e1rm(a)?b:a); if(e1rm(top)>prev.v+0.01) prs.push({name:e.name,st:top}) });
  const id=new Date().toISOString().replace(/[^0-9]/g,'').slice(0,14);
  const dur=Math.max(1,Math.round((Date.now()-S.draft.startedAt)/60000));
  const doc={date:new Date().toISOString(),dayId:S.draft.dayId,dayName:S.draft.dayName,durationMin:dur,note:S.draft.note||'',entries};
  try{ await write('sessions/'+id,doc) }catch(e){return}
  S.summary={dayName:doc.dayName,dur,sets:entries.reduce((n,e)=>n+(e.sets?e.sets.length:0),0),
    vol:Math.round(entries.reduce((v,e)=>v+(e.sets?e.sets.reduce((a,s)=>a+setVol(s),0):0),0)),
    cardio:entries.filter(e=>e.cardio).reduce((m,e)=>m+(e.cardio.min||0),0),prs};
  S.draft=null; saveDraft(); stopTimer(); S.view='summary'; render(); scrollTo(0,0) }

/* ================= Timer & Wake Lock ================= */
let ac=null;
function ensureAudio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function beep(){ if(ST().sound!==false){try{if(ac)[0,.25,.5].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.25,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+.2);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.2)})}catch(e){}}
  if(ST().vibrate!==false){try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}} }
function startTimer(sec,label){ if(!sec) return; S.timer={end:Date.now()+sec*1000,total:sec,label,beeped:false};lsSet('gt_timer',S.timer);tick()}
function stopTimer(){S.timer=null;lsSet('gt_timer',null);$('timer').hidden=true}
function tick(){ const t=S.timer,el=$('timer');
  if(t){const left=(t.end-Date.now())/1000; el.hidden=false; $('tLabel').textContent=left>0?'Pause · '+t.label:'Los geht\'s – nächster Satz!';
    $('tTime').textContent=fmtT(left); el.classList.toggle('over',left<=0); $('tBar').style.width=Math.max(0,Math.min(100,100*left/(t.total||1)))+'%';
    if(left<=0&&!t.beeped){t.beeped=true;lsSet('gt_timer',t);beep()} if(left<-30) stopTimer()}
  else el.hidden=true;
  const e2=$('elapsed'); if(e2&&S.draft) e2.textContent=fmtT((Date.now()-S.draft.startedAt)/1000) }
setInterval(tick,250);
let wl=null;
async function updateWake(){ const want=ST().wake!==false&&S.view==='workout'&&S.draft&&document.visibilityState==='visible';
  try{ if(want&&!wl&&navigator.wakeLock){ wl=await navigator.wakeLock.request('screen'); wl.addEventListener('release',()=>{wl=null}) } else if(!want&&wl){ const w=wl; wl=null; await w.release() } }catch(e){} }
document.addEventListener('visibilitychange',()=>{ updateWake(); tick() });

/* ================= Render ================= */
function spark(vals,color='#4ade80'){ if(vals.length<2) return ''; const w=300,h=46,p=4,mn=Math.min(...vals),mx=Math.max(...vals),rg=mx-mn||1;
  const pts=vals.map((v,i)=>[p+i*(w-2*p)/(vals.length-1),h-p-(v-mn)/rg*(h-2*p)]);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" points="${pts.map(q=>q.join(',')).join(' ')}"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3" fill="${color}"/></svg>` }

function render(){
  const act=document.activeElement, k=act&&act.dataset?act.dataset.k:null; let sel=null; try{sel=k?[act.selectionStart,act.selectionEnd]:null}catch(e){}
  const navV={workout:'home',summary:'home',editsess:'history'}[S.view]||S.view;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===navV));
  document.querySelector('.gear').classList.toggle('on',S.view==='settings');
  let h='';
  if(S.view==='workout'&&S.draft) h=vWorkout();
  else if(S.view==='summary'&&S.summary) h=vSummary();
  else if(S.view==='history') h=vHistory();
  else if(S.view==='editsess'&&S.editSess) h=vEditSess();
  else if(S.view==='progress') h=vProgress();
  else if(S.view==='plan') h=vPlan();
  else if(S.view==='settings') h=vSettings();
  else {S.view='home'; h=vHome()}
  $('app').innerHTML=h;
  $('modal').innerHTML=S.modal?vModal():'';
  $('savebar').innerHTML=(S.view==='plan'&&S.peDirty)?`<div class="savebar"><button class="btn ghost" data-act="pe-reset">Verwerfen</button><button class="btn pri" data-act="pe-save">Plan speichern</button></div>`:'';
  if(k){const el=document.querySelector(`[data-k="${CSS.escape(k)}"]`); if(el){el.focus({preventScroll:true}); try{if(sel)el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
  tick(); updateWake();
}

        <div class="cgrid">${def.fields.map(f=>`<div><label>${esc(CARDIO_FIELDS[f][0])}</label><input type="number" inputmode="decimal" step="${CARDIO_FIELDS[f][1]}" data-k="c${i}_${f}" data-cv="${f}" data-i="${i}" value="${esc(it.vals[f]??'')}" placeholder="${lc&&lc.c[f]!=null?esc(lc.c[f]):(f==='min'&&it.target?esc(it.target):'')}"></div>`).join('')}</div>

  if(E.length){ const ago=d=>{const t=new Date(Date.now()-d*864e5); return E.filter(x=>new Date(x.d)<=t).pop()};
    const ch=ref=>{ if(!ref) return '–'; const d=r2(last.kg-ref.kg); return `<span class="${d<0?'up':d>0?'down':''}">${d>0?'+':''}${d} kg</span>` };
    h+=`<div class="row" style="margin-top:10px"><div class="stat"><b>${esc(last.kg)}</b><span class="muted">aktuell</span></div><div class="stat"><b style="font-size:17px">${ch(ago(7))}</b><span class="muted">7 Tage</span></div><div class="stat"><b style="font-size:17px">${ch(ago(30))}</b><span class="muted">30 Tage</span></div></div>
      ${spark(E.slice(-40).map(x=>+x.kg),'#60a5fa')}<div class="muted" style="margin-top:6px">${E.slice(-4).reverse().map(x=>`${esc(x.d.slice(8,10)+'.'+x.d.slice(5,7)+'.')} ${esc(x.kg)} kg`).join(' · ')} <button class="btn xs ghost" data-act="bw-del">${S.confirm==='bwdel'?'Sicher?':'Letzten löschen'}</button></div>`;
  } else h+='<div class="muted" style="margin-top:8px">Am besten morgens nüchtern wiegen, 2–3× pro Woche.</div>';
  h+='</div>';
  // Cardio
  const cs=[]; S.sessions.forEach(s=>(s.entries||[]).forEach(e=>{ if(e.cardio) cs.push({date:s.date,e}) }));
  h+='<div class="sec">Cardio</div><div class="card">';
  if(!cs.length) h+='<div class="muted">Noch kein Cardio eingetragen. Füg es im Training mit „+ Cardio“ hinzu oder starte „Nur Cardio“.</div>';
  else{ const weeks=[]; for(let w=7;w>=0;w--){ const ws=weekStart(new Date(Date.now()-w*7*864e5)), we=new Date(ws.getTime()+7*864e5); weeks.push(cs.filter(x=>{const d=new Date(x.date);return d>=ws&&d<we}).reduce((m,x)=>m+(x.e.cardio.min||0),0)) }
    const avg=Math.round(weeks.slice(3,7).reduce((a,b)=>a+b,0)/4);
    h+=`<div class="row"><div class="stat"><b>${Math.round(weeks[7])}</b><span class="muted">Min. diese Woche</span></div><div class="stat"><b>${avg}</b><span class="muted">Ø Min./Woche (4 W.)</span></div></div>${spark(weeks,'#fbbf24')}<div class="muted" style="margin-top:4px">Minuten pro Woche, letzte 8 Wochen</div>`;
    const types={}; cs.forEach(x=>{ (types[x.e.exId]=types[x.e.exId]||[]).push(x) });
    Object.entries(types).forEach(([id,l])=>{ const d=CARD[id]||{icon:'❤️',name:l[0].e.name}; h+=`<div style="margin-top:12px"><b>${d.icon} ${esc(d.name||l[0].e.name)}</b> <span class="muted">· ${l.length}×</span><div class="muted">Zuletzt ${fmtD(l[0].date)}: ${fmtCardio(l[0].e.cardio,d.fields)}</div></div>` });
  }
  h+='</div><div class="sec">Kraft</div>';
  const order=[]; days().forEach(d=>(d.exercises||[]).forEach(e=>{ if(!order.includes(e.id)&&!isCardio(e.id)) order.push(e.id) }));
  const names={}; S.sessions.forEach(s=>(s.entries||[]).forEach(e=>{ if(!e.sets) return; names[e.exId]=names[e.exId]||e.name; if(!order.includes(e.exId)) order.push(e.exId) }));
  if(!order.length) return h+'<div class="card muted">Noch keine Daten.</div>';
  order.forEach(id=>{
    const pts=[]; S.sessions.forEach(s=>{const e=(s.entries||[]).find(x=>x.exId===id&&x.sets); if(e&&e.sets.length){
      const best=e.sets.reduce((a,b)=>e1rm(b)>e1rm(a)?b:a); pts.push({date:s.date,best,e1:e1rm(best),vol:e.sets.reduce((v,x)=>v+setVol(x),0)})}});
    const nm=names[id]||exInfo(id).name;
    h+=`<div class="card prog"><div class="exhead">${thumbHTML(id)}<div class="grow"><div class="between"><div class="exname">${esc(nm)}</div>${pts.length?`<button class="btn xs ghost" data-act="prog-tog" data-id="${esc(id)}">${S.openProg[id]?'Weniger':'Details'}</button>`:''}</div>`;
    if(!pts.length){h+='<div class="muted">Noch keine Daten.</div></div></div></div>';return}
    const pr=pts.reduce((a,b)=>b.e1>a.e1?b:a), diff=r2(+pts[0].best.kg-+pts[pts.length-1].best.kg);
    h+=`<div class="muted">Rekord <span style="color:var(--txt)">${fmtSet(pr.best)}</span> · ${pts.length}× · ${diff>0?`<span class="up">+${diff} kg</span>`:diff<0?`<span class="down">${diff} kg</span>`:'±0 kg'}</div></div></div>`;
    h+=spark(pts.slice(0,30).reverse().map(p=>p.e1));
    if(S.openProg[id]) h+=`<table><tr><th>Datum</th><th>Bester Satz</th><th>Volumen</th></tr>${pts.slice(0,10).map(p=>`<tr><td>${fmtD(p.date)}</td><td>${fmtSet(p.best)} kg</td><td>${Math.round(p.vol)} kg</td></tr>`).join('')}</table>`;
    h+='</div>' });
  return h }

function pickList(){ const M=S.modal, q=M.q.trim().toLowerCase();

function vInfo(id){ const i=exInfo(id), best=bestFor(id), hist=[];
  S.sessions.forEach(s=>{ const e=(s.entries||[]).find(x=>x.exId===id); if(e&&hist.length<5) hist.push({date:s.date,e}) });

    ${i.cues&&i.cues.length?`<div class="sec">Ausführung</div><ol class="cues">${i.cues.map(c=>`<li>${esc(c)}</li>`).join('')}</ol>`:''}

    ${hist.length?`<div class="sec">Zuletzt</div>${hist.map(x=>`<div class="between" style="padding:3px 0;font-size:14px"><span class="muted">${fmtD(x.date)}</span><span>${x.e.cardio?fmtCardio(x.e.cardio,(CARD[id]||{}).fields):x.e.sets.map(fmtSet).join(' · ')}</span></div>`).join('')}`:''}
    </div></div></div>` }

/* ================= Aktionen ================= */
function confirmTap(key){ if(S.confirm===key){S.confirm=null;return true} S.confirm=key; clearTimeout(confirmTap._t); confirmTap._t=setTimeout(()=>{S.confirm=null;render()},3000); render(); return false }
function openPicker(mode,extra){ S.modal={mode,q:'',scope:'today',newName:'',newMuscle:'',newUni:false,...extra}; render() }
function planEntry(id,old){ const info=exInfo(id);
  if(isCardio(id)) return {id,name:info.name,kind:'c',target:old&&old.target||''};
  return {id,name:info.name,muscle:info.muscle,sets:old&&old.sets||ST().defSets,repMin:old&&old.repMin||ST().defRepMin,repMax:old&&old.repMax||ST().defRepMax,rest:old&&old.rest!=null?old.rest:ST().defRest,uni:!!info.uni} }
function pick(id){
  const M=S.modal; S.modal=null;
  if(M.mode.startsWith('w-')){
    const old=M.mode==='w-swap'?S.draft.items[M.i]:null;
    const it=makeItem(old&&old.kind==='s'&&!isCardio(id)?{id,sets:old.sets,repMin:old.repMin,repMax:old.repMax,rest:old.rest}:{id});
    if(old) S.draft.items[M.i]=it; else S.draft.items.push(it);
    saveDraft();
    if(M.scope==='plan'&&planDayEx()){ const p=clone(S.plan), ex=p.days[S.draft.dayId].exercises=p.days[S.draft.dayId].exercises||[];
      const k=old?ex.findIndex(e=>e.id===old.exId):-1; const pe=planEntry(id,k>=0?ex[k]:null); if(k>=0) ex[k]=pe; else ex.push(pe);
      savePlan(p).then(()=>toast('Plan aktualisiert')).catch(()=>{}) }
    else toast(old?'Für heute getauscht':'Hinzugefügt');
  } else {
    const ex=S.planEdit.days[M.d].exercises=S.planEdit.days[M.d].exercises||[];
    if(M.mode==='pe-swap') ex[M.i]=planEntry(id,ex[M.i]); else ex.push(planEntry(id));
    S.peDirty=true;
  }
  render() }
function moveArr(a,i,d){ const j=i+d; if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]] }
function peChange(){ if(!S.peDirty){S.peDirty=true;render()} }
function exportObj(){ return {app:'gym-tracker',version:3,exportedAt:new Date().toISOString(),plan:S.plan,library:S.lib,settings:S.settings,body:S.body,sessions:S.sessions} }

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, i=+b.dataset.i, j=+b.dataset.j, D=S.draft;
  if(a==='m-close-bg'&&e.target!==b) return;
  ensureAudio();
  switch(a){
  case 'nav': S.view=(b.dataset.v==='home'&&S.draft)?'workout':b.dataset.v; S.noteEdit=null; S.restEdit=null; render(); scrollTo(0,0); break;
  case 'start': startWorkout(b.dataset.d); break;
  case 'start-free': startEmpty(); break;
  case 'start-cardio': startEmpty('Cardio','cardio'); openPicker('w-cardio',{only:'cardio'}); break;
  case 'resume': S.view='workout'; render(); break;
  case 'discard': if(confirmTap('discard')){S.draft=null;saveDraft();stopTimer();S.view='home';render()} break;
  case 'done': { const it=D.items[i], r=it.rows[j];
    if(!r.done){ const tr=b.closest('tr'), get=f=>tr.querySelector(`[data-f=${f}]`);
      const fill=f=>{ const el=get(f); if(el&&r[f]===''&&num(el.placeholder)!=null&&!el.placeholder.includes('–')) r[f]=el.placeholder };
      fill('kg'); fill('reps'); if(it.uni) fill('repsR');
      if(r.reps===''){toast(it.uni?'Wiederholungen links eintragen':'Wiederholungen eintragen');get('reps').focus();return}
      if(it.uni&&r.repsR===''){toast('Wiederholungen rechts eintragen');get('repsR').focus();return}
      r.done=true; const allDone=it.rows.every(x=>x.done), nxt=D.items[i+1];
      if(ST().autoTimer!==false) startTimer(it.rest, allDone&&nxt?'als Nächstes: '+nxt.name:it.name);
    } else r.done=false;
    saveDraft(); render(); break }
  case 'c-done': { const it=D.items[i];
    if(!it.done){ document.querySelectorAll(`[data-cv][data-i="${i}"]`).forEach(el=>{ const f=el.dataset.cv; if((it.vals[f]??'')===''&&num(el.placeholder)!=null) it.vals[f]=el.placeholder });
      if(!(num(it.vals.min)>0)){toast('Minuten eintragen');return} it.done=true } else it.done=false;
    saveDraft(); render(); break }
  case 'kgm': case 'kgp': { const r=D.items[i].rows[j], step=+ST().step||2.5, inp=b.parentNode.querySelector('input');
    const base=num(r.kg)??num(inp.placeholder)??0; r.kg=String(Math.max(0,r2(base+(a==='kgp'?step:-step)))); saveDraft(); render(); break }
  case 'addset': { const rows=D.items[i].rows, l=rows[rows.length-1]; rows.push({kg:l?l.kg:'',reps:'',repsR:'',done:false}); saveDraft(); render(); break }
  case 'delset': { const rows=D.items[i].rows; if(rows.length>1){rows.pop();saveDraft();render()} break }
  case 'w-swap': openPicker('w-swap',{i,cur:D.items[i].exId,muscle:D.items[i].muscle,only:D.items[i].kind==='c'?'cardio':null}); break;
  case 'w-add': openPicker('w-add',{}); break;
  case 'w-cardio': openPicker('w-cardio',{only:'cardio'}); break;
  case 'w-uni': { const it=D.items[i]; it.uni=!it.uni; it.rows.forEach(r=>{ if(r.repsR==null) r.repsR='' }); saveDraft(); render(); break }
  case 'w-up': moveArr(D.items,i,-1); saveDraft(); render(); break;
  case 'w-down': moveArr(D.items,i,1); saveDraft(); render(); break;
  case 'w-del': if(confirmTap('wdel'+i)){ D.items.splice(i,1); saveDraft(); render() } break;
  case 'rest-edit': S.restEdit=S.restEdit===i?null:i; render(); break;
  case 'rest-m': case 'rest-p': { const it=D.items[i]; it.rest=Math.max(0,(+it.rest||0)+(a==='rest-p'?15:-15)); saveDraft(); render(); break }
  case 'rest-close': S.restEdit=null; render(); break;
  case 'rest-save': { const it=D.items[i], p=clone(S.plan), ex=(p.days[D.dayId]||{}).exercises||[]; const k=ex.findIndex(x=>x.id===it.exId);
    if(k>=0){ ex[k].rest=it.rest; savePlan(p).then(()=>toast('Pause im Plan gespeichert')).catch(()=>{}) } else toast('Übung ist nicht im Plan'); S.restEdit=null; render(); break }
  case 'note-edit': S.noteEdit=b.dataset.ex; render(); break;
  case 'note-done': S.noteEdit=null; render(); break;
  case 'info': S.modal={mode:'info',ex:b.dataset.ex}; render(); break;
  case 'finish': b.disabled=true; await finish(); b.disabled=false; break;
  case 'delsess': { const id=b.dataset.id; if(confirmTap('del:'+id)){ try{await S.db.doc('sessions/'+id).delete();toast('Gelöscht')}catch(err){toast('Löschen fehlgeschlagen')} render() } break }
  case 'es-open': { const s=S.sessions.find(x=>x.id===b.dataset.id); if(s){S.editSess=clone(s);S.view='editsess';render();scrollTo(0,0)} break }
  case 'es-delset': S.editSess.entries[i].sets.splice(j,1); render(); break;
  case 'es-addset': { const st=S.editSess.entries[i].sets, l=st[st.length-1]; st.push(l?{...l}:{kg:0,reps:0}); render(); break }
  case 'es-delex': S.editSess.entries.splice(i,1); render(); break;
  case 'es-save': { const s=clone(S.editSess), id=s.id; delete s.id;
    s.entries=(s.entries||[]).map(en=>{ if(en.cardio){ const c={}; Object.entries(en.cardio).forEach(([f,v])=>{ const n=num(v); if(n!=null) c[f]=n }); return {...en,cardio:c} }
      return {...en,sets:(en.sets||[]).map(x=>{ const o={kg:num(x.kg)||0,reps:num(x.reps)||0}; if(x.repsR!=null&&x.repsR!=='') o.repsR=num(x.repsR)||0; return o }).filter(x=>x.reps>0)} })
      .filter(en=>en.cardio||en.sets.length);
    try{await write('sessions/'+id,s);toast('Gespeichert');S.editSess=null;S.view='history';render()}catch(err){} break }
  case 'prog-tog': S.openProg[b.dataset.id]=!S.openProg[b.dataset.id]; render(); break;
  case 'bw-add': { const v=num($('bwIn').value); if(!v||v<20||v>300){toast('Gültiges Gewicht eingeben');return}
    const E=S.body.entries.filter(x=>x.d!==today()); E.push({d:today(),kg:r2(v)}); E.sort((x,y)=>x.d<y.d?-1:1); S.body.entries=E.slice(-1500);
    saveBody().then(()=>toast('Eingetragen')).catch(()=>{}); render(); break }
  case 'bw-del': if(confirmTap('bwdel')){ S.body.entries.pop(); saveBody().catch(()=>{}); render() } break;
  /* Plan */
  case 'pe-swap': { const ex=S.planEdit.days[b.dataset.d].exercises[i]; openPicker('pe-swap',{d:b.dataset.d,i,cur:ex.id,muscle:ex.muscle||exInfo(ex.id).muscle,only:isCardio(ex.id)?'cardio':null}); break }
  case 'pe-add': openPicker('pe-add',{d:b.dataset.d}); break;
  case 'pe-cardio': openPicker('pe-cardio',{d:b.dataset.d,only:'cardio'}); break;
  case 'pe-uni': { const ex=S.planEdit.days[b.dataset.d].exercises[i]; ex.uni=!(ex.uni??exInfo(ex.id).uni); S.peDirty=true; render(); break }
  case 'pe-up': moveArr(S.planEdit.days[b.dataset.d].exercises,i,-1); S.peDirty=true; render(); break;
  case 'pe-down': moveArr(S.planEdit.days[b.dataset.d].exercises,i,1); S.peDirty=true; render(); break;
  case 'pe-del': S.planEdit.days[b.dataset.d].exercises.splice(i,1); S.peDirty=true; render(); break;
  case 'day-up': case 'day-down': { const o=S.planEdit.order, k=o.indexOf(b.dataset.d); moveArr(o,k,a==='day-up'?-1:1); S.peDirty=true; render(); break }
  case 'day-del': if(confirmTap('dd'+b.dataset.d)){ delete S.planEdit.days[b.dataset.d]; S.planEdit.order=S.planEdit.order.filter(x=>x!==b.dataset.d); S.peDirty=true; render() } break;
  case 'day-add': { const id='d'+Date.now().toString(36); S.planEdit.days[id]={name:'Neuer Tag',exercises:[]}; S.planEdit.order.push(id); S.peDirty=true; render(); break }
  case 'pe-save': { const P=clone(S.planEdit);
    Object.values(P.days).forEach(d=>(d.exercises||[]).forEach(x=>{ if(isCardio(x.id)){ x.target=num(x.target)||''; return }
      x.sets=Math.max(1,Math.round(num(x.sets)||ST().defSets)); x.repMin=Math.max(1,Math.round(num(x.repMin)||ST().defRepMin)); x.repMax=Math.max(x.repMin,Math.round(num(x.repMax)||ST().defRepMax)); x.rest=Math.max(0,Math.round(num(x.rest)??ST().defRest)) }));
    try{await savePlan(P); S.peDirty=false; S.planEdit=null; toast('Plan gespeichert')}catch(err){} render(); break }
  case 'pe-reset': S.peDirty=false; S.planEdit=null; render(); break;
  /* Einstellungen & Daten */
  case 'cust-del': { const id=b.dataset.id; if(confirmTap('cd'+id)){ S.lib.custom=S.lib.custom.filter(c=>c.id!==id); saveLib().catch(()=>{}); render() } break }
  case 'exp': S.exportText=JSON.stringify(exportObj(),null,1); render(); break;
  case 'exp-copy': try{await navigator.clipboard.writeText(S.exportText);toast('Kopiert')}catch(err){ const t=$('expTxt'); t.focus(); t.select(); toast('Markiert – jetzt kopieren') } break;
  case 'exp-close': S.exportText=null; render(); break;
  case 'backup': { const blob=new Blob([JSON.stringify(exportObj(),null,1)],{type:'application/json'}), url=URL.createObjectURL(blob);
    const l=document.createElement('a'); l.href=url; l.download='gym-tracker-backup-'+today()+'.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000);
    lsSet('gt_lastBackup',new Date().toISOString()); toast('Backup erstellt'); render(); break }
  case 'imp-cancel': S.importData=null; render(); break;
  case 'imp-ok': { const d=S.importData, o={};
    if(d.plan) o['plan/main']=d.plan; o['library/main']=d.library||{custom:[],notes:{}}; if(d.settings) o['settings/main']=d.settings; o['body/main']=d.body||{entries:[]};
    d.sessions.forEach(s=>{ const x={...s}, id=x.id||new Date(x.date).toISOString().replace(/[^0-9]/g,'').slice(0,14); delete x.id; o['sessions/'+id]=x });
    try{ LocalDB.replace(o); S.importData=null; S.planEdit=null; S.peDirty=false; toast('Backup wiederhergestellt') }catch(err){ toast('Import fehlgeschlagen – zu wenig Speicher') }
    render(); break }
  /* Modal */
  case 'm-close': case 'm-close-bg': S.modal=null; render(); break;
  case 'm-scope': S.modal.scope=b.dataset.s; render(); break;
  case 'm-pick': pick(b.dataset.id); break;
  case 'm-create': { const nm=(S.modal.newName||S.modal.q||'').trim(); if(!nm){toast('Namen eingeben');return}
    const ms=S.modal.newMuscle||S.modal.muscle||'Brust';
    const id='c_'+nm.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_').slice(0,30)+'_'+Date.now().toString(36);
    S.lib.custom=[...(S.lib.custom||[]),{id,name:nm,muscle:ms,uni:!!S.modal.newUni}]; saveLib().catch(()=>{}); pick(id); break }
  /* Timer */
  case 'tplus': if(S.timer){S.timer.end=Math.max(S.timer.end,Date.now())+15000;S.timer.total=Math.max(S.timer.total,(S.timer.end-Date.now())/1000);S.timer.beeped=false;lsSet('gt_timer',S.timer);tick()} break;
  case 'tminus': if(S.timer){S.timer.end-=15000;lsSet('gt_timer',S.timer);tick()} break;
  case 'tstop': stopTimer(); break;
  }
});
document.addEventListener('input',e=>{ const t=e.target, ds=t.dataset;
  if(ds.f&&S.draft){ const it=S.draft.items[+ds.i]; if(it&&it.rows){it.rows[+ds.j][ds.f]=t.value; saveDraft()} }
  else if(ds.cv&&S.draft){ const it=S.draft.items[+ds.i]; if(it){ it.vals[ds.cv]=t.value; saveDraft() } }
  else if(ds.wnote&&S.draft){ S.draft.note=t.value; saveDraft() }
  else if(ds.peEx&&S.planEdit){ S.planEdit.days[ds.peEx].exercises[+ds.i][ds.field]=t.value; peChange() }
  else if(ds.peDay&&S.planEdit){ S.planEdit.days[ds.peDay].name=t.value; peChange() }
  else if(ds.q&&S.modal){ S.modal.q=t.value; $('pickList').innerHTML=pickList() }
  else if(ds.nn&&S.modal){ S.modal.newName=t.value }
  else if(ds.es&&S.editSess){ S.editSess.entries[+ds.i].sets[+ds.j][ds.es]=t.value }
  else if(ds.esc&&S.editSess){ S.editSess.entries[+ds.i].cardio[ds.esc]=t.value }
  else if(ds.esnote&&S.editSess){ S.editSess.note=t.value }
});
document.addEventListener('change',e=>{ const t=e.target, ds=t.dataset;
  if(ds.exnote){ const v=t.value.trim(), id=ds.exnote; if((S.lib.notes[id]||'')===v) return; S.lib.notes={...S.lib.notes}; if(v) S.lib.notes[id]=v; else delete S.lib.notes[id]; saveLib().then(()=>toast('Notiz gespeichert')).catch(()=>{}) }
  else if(ds.set){ S.settings={...S.settings,[ds.set]:t.checked}; saveSettings().catch(()=>{}) }
  else if(ds.setsel){ S.settings={...S.settings,[ds.setsel]:num(t.value)}; saveSettings().catch(()=>{}) }
  else if(ds.setnum){ const v=num(t.value); if(v==null||v<0){render();return} S.settings={...S.settings,[ds.setnum]:Math.round(v)}; saveSettings().catch(()=>{}) }
  else if(ds.nm&&S.modal){ S.modal.newMuscle=t.value }
  else if(ds.nu&&S.modal){ S.modal.newUni=t.checked }
  else if(ds.imp&&t.files&&t.files[0]){ const fr=new FileReader(); fr.onload=()=>{ try{ const d=JSON.parse(fr.result);
      if(!d||(!d.plan&&!Array.isArray(d.sessions))) throw 0; d.sessions=Array.isArray(d.sessions)?d.sessions:[]; S.importData=d; render() }catch(err){ toast('Keine gültige Backup-Datei') } }; fr.readAsText(t.files[0]) }
});
if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
